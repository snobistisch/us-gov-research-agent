[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "us-gov-research-agent"
version = "0.2.0"
description = "A cited AI research agent for SEC filings and U.S. federal government data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "US Gov Research Agent contributors" }]
keywords = ["sec", "edgar", "government", "research", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
hermes = [
  "mcp>=2,<3",
]
dev = [
  "mcp>=2,<3",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
research-agent = "us_gov_research.cli:main"
research-agent-mcp = "us_gov_research.mcp_server:main"

[project.urls]
Documentation = "https://github.com/snobistisch/us-gov-research-agent#readme"
Issues = "https://github.com/snobistisch/us-gov-research-agent/issues"
Source = "https://github.com/snobistisch/us-gov-research-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/us_gov_research"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
